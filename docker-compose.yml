# Backend do Aventura das Notas.
#
#   docker compose up -d          sobe banco + API
#   docker compose logs -f api    acompanha
#   docker compose down           para (dados persistem no volume)
#
# Em producao, ponha um nginx/caddy na frente para TLS. Ver server/DEPLOY.md.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aventura}
      POSTGRES_USER: ${POSTGRES_USER:-aventura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Exposto so em localhost: nunca deixe o Postgres aberto para a internet.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aventura} -d ${POSTGRES_DB:-aventura}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-aventura}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aventura}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Precisam estar listadas aqui: o .env do Compose serve para interpolar
      # este arquivo, nao para injetar variaveis no container.
      RANKING_MOSTRA_APELIDOS: ${RANKING_MOSTRA_APELIDOS:-true}
      RANKING_TAMANHO_TOPO: ${RANKING_TAMANHO_TOPO:-10}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-300}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-20}
      RATE_LIMIT_DENUNCIA: ${RATE_LIMIT_DENUNCIA:-10}
      RATE_LIMIT_PARTIDAS: ${RATE_LIMIT_PARTIDAS:-120}
      RATE_LIMIT_TURMA: ${RATE_LIMIT_TURMA:-20}
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-3000}:3000"

volumes:
  db-data:
